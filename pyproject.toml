[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gametest-ai"
version = "0.1.0"
description = "GameTest AI: open tools for small game developers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "dhawiaymen"}]
dependencies = ["playwright>=1.50,<2"]
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: Microsoft :: Windows", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2", "pyinstaller>=6,<7"]

[project.scripts]
gametest-ai = "gametest_ai.cli:main"

[project.gui-scripts]
gametest-ai-gui = "gametest_ai.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gametest_ai = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["browser: requires installed Playwright Chromium", "gui: requires a display"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
