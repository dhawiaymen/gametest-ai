<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Five Tap Challenge</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1425;color:#e9f3ff;font:16px system-ui;text-align:center}
main{max-width:560px;margin:auto;padding:16px}h1{font-size:24px;margin:8px}p{color:#bbc9dc}
canvas{max-width:100%;max-height:70vh;object-fit:contain;border:1px solid #547092;border-radius:14px;touch-action:none}
button{padding:12px 28px;border:0;border-radius:8px;background:#58e0ae;font-weight:700;cursor:pointer}
canvas:focus,button:focus{outline:3px solid #ffe08a;outline-offset:3px}
#status{font-variant-numeric:tabular-nums;font-size:13px}</style></head>
<body><main><h1>Five Tap Challenge</h1><p>Move with the pointer or arrow keys. Tap, Space, or Enter to interact.</p>
<canvas tabindex="0" aria-label="Mini-game play area"></canvas><p id="status" role="status"></p>
<button id="restart">Restart</button></main><script src="game.js"></script></body></html>
